name: Publish Gem
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        required: true
        type: string

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  push:
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write

    steps:
      # Set up
      - uses: actions/checkout@v7
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: ruby

      - name: Update version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i "s/\".*\"/\"$VERSION\"/" lib/ferrum_pdf/version.rb
          bundle config set --local deployment 'false'
          bundle
          git config user.name 'GitHub Actions'
          git config user.email github-actions@github.com
          git add Gemfile.lock lib
          # Skip the commit if the version was already bumped on main
          git diff --cached --quiet || git commit -m "Version bump"
          git push

      # Release
      - uses: rubygems/release-gem@v1

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "v$VERSION" --generate-notes
